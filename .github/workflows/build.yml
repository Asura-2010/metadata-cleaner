name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"
      - "backup/**"
  workflow_dispatch:

jobs:
  # ── macOS build ──────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Read version
        id: version
        run: |
          VER=$(python -c "from metadata_cleaner import __version__; print(__version__)")
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Build .app
        run: |
          pyinstaller \
            --windowed \
            --name "MetadataCleaner" \
            --osx-bundle-identifier "com.asura.metadata-cleaner" \
            --icon icon.icns \
            --clean \
            metadata_cleaner.py

      - name: Create .dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/dmg
          cp -R "dist/MetadataCleaner.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "MetadataCleaner" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            "dist/MetadataCleaner-${VERSION}-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-dmg
          path: dist/MetadataCleaner-*-macOS.dmg

  # ── Windows build ────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Read version
        id: version
        shell: bash
        run: |
          VER=$(python -c "from metadata_cleaner import __version__; print(__version__)")
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Build .exe (onefile)
        run: |
          pyinstaller `
            --windowed `
            --onefile `
            --name "MetadataCleaner" `
            --icon icon.ico `
            --hidden-import pillow_heif `
            --hidden-import tkinterdnd2 `
            --add-data "icon.ico;." `
            --clean `
            --noconfirm `
            metadata_cleaner.py

      - name: Rename with version
        shell: bash
        run: |
          mv dist/MetadataCleaner.exe "dist/MetadataCleaner-${{ steps.version.outputs.version }}-Windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-exe
          path: dist/MetadataCleaner-*-Windows.exe

  # ── Create GitHub Release ────────────────────────────────
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VER=$(python3 -c "import re; f=open('metadata_cleaner.py').read(); m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', f); print(m.group(1))")
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${VERSION} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download macOS artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: macOS-dmg

      - name: Download Windows artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: Windows-exe

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "自动构建。macOS 下载 .dmg，Windows 下载 .exe。" \
            MetadataCleaner-*-macOS.dmg \
            MetadataCleaner-*-Windows.exe
        env:
          GH_TOKEN: ${{ github.token }}
